<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Today</title><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F7F3EE;--ink:#3B2F26;--muted:#8A7A6C;--accent:#C26A3D;--line:#E6DDD2;--soft:#EFE8DF}
@media (prefers-color-scheme: dark){:root{--bg:#25211E;--ink:#F1E9DF;--muted:#B3A595;--accent:#E39A6E;--line:#433B34;--soft:#2F2A26}}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;justify-content:safe center;padding:22px 26px;gap:16px;border-radius:14px}
.serif{font-family:Georgia,"Times New Roman",serif}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:grid;grid-template-columns:1.05fr 1.3fr .95fr;gap:26px;align-items:center}
.clock .time{font-size:52px;line-height:1.05;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.clock .date{font-size:15px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:11px}
.bar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar-top span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--accent)}
.cal table{width:100%;border-collapse:collapse;font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.cal th{color:var(--muted);font-weight:600;font-size:10px;padding-bottom:5px}
.cal td{padding:3px 0;color:var(--ink)}
.cal td.o{color:transparent}
.cal td.t span{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700}
.cal .m{margin-bottom:8px}
.thought{border-top:1px solid var(--line);padding-top:14px;display:flex;gap:12px;align-items:baseline}
.thought .q{font-size:19px}
.thought .q b{color:var(--accent);font-weight:400}
@media (max-width:760px){body{padding:14px 16px;gap:10px}.row{grid-template-columns:1fr;gap:12px}.cal{display:none}.clock{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}.clock .label{width:100%}.clock .time{font-size:34px;margin:2px 0 0}.clock .date{font-size:13px}.bars{gap:8px}.bars>div:nth-child(1),.bars>div:nth-child(3){display:none}.bar-top{font-size:12px;margin-bottom:4px}.thought{flex-direction:column;gap:4px;padding-top:10px}.thought .q{font-size:16px}}
</style></head><body>
<div class="row">
  <div class="clock"><div class="label" id="greet">Hello</div><div class="time serif" id="time">--:--</div><div class="date" id="date"></div></div>
  <div class="bars" id="bars"></div>
  <div class="cal"><div class="label m" id="month"></div><table id="cal"></table></div>
</div>
<div class="thought"><div class="label" style="white-space:nowrap">✦ Habit thought</div><div class="q serif" id="q"></div></div>
<script>
const Q=["Never miss twice.", "Make it so small you can't say no.", "You don't rise to your goals. You fall to your habits.", "Show up, even for 2 minutes.", "A good day is 4 out of 6. Not 6 out of 6.", "Same time, same place, every day.", "Put the water bottle where you can see it.", "Tick the box. Feel the win.", "Progress, not perfection.", "The best habit is the one you do today.", "Start tiny. Grow later.", "Motivation follows action.", "Missed yesterday? Today is a fresh square.", "Make the good habit easy and the bad habit hard.", "Stack it: after I ..., I will ...", "Your streak is a promise to yourself.", "Rest is a habit too.", "One page. One glass. One walk.", "Be the kind of person who does it.", "Small wins, every single day.", "Phone out of the bedroom, sleep in.", "Track it to keep it.", "You are what you repeat.", "Good habits are boring. That is the point.", "Focus on one habit this month.", "Celebrate the tiny wins.", "Don't wait to feel ready.", "Every check mark is a vote for who you want to be.", "Energy comes from doing, not waiting.", "Keep the chain going.", "Do the tiny version on busy days."];
let H24=true;try{const v=localStorage.getItem('sf_h24_habit');if(v!==null)H24=v==='1';}catch(e){}
function render(){
 const d=new Date(),h=d.getHours(),y=d.getFullYear(),mo=d.getMonth();
 document.getElementById('greet').textContent=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
 document.getElementById('time').textContent=d.toLocaleTimeString([],H24?{hour:'2-digit',minute:'2-digit',hourCycle:'h23'}:{hour:'numeric',minute:'2-digit',hour12:true});
 document.getElementById('date').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
 const dayS=new Date(y,mo,d.getDate()),dayP=(d-dayS)/864e5;
 const wd=(d.getDay()+6)%7,wkS=new Date(y,mo,d.getDate()-wd),wkP=(d-wkS)/(7*864e5);
 const mS=new Date(y,mo,1),mE=new Date(y,mo+1,1),mP=(d-mS)/(mE-mS);
 const yS=new Date(y,0,1),yE=new Date(y+1,0,1),yP=(d-yS)/(yE-yS);
 const left=n=>n+(n==1?' day left':' days left');
 const B=[["Today",dayP,Math.round(dayP*100)+'%'],["This week",wkP,left(7-wd-1+1-1+ (1))],["This month",mP,left(Math.ceil((mE-d)/864e5))],[y+"",yP,left(Math.ceil((yE-d)/864e5))]];
 B[1][2]=left(7-wd);
 document.getElementById('bars').innerHTML=B.map(b=>`<div><div class="bar-top"><span>${b[0]}</span><span>${Math.floor(b[1]*100)}% · ${b[2]}</span></div><div class="track"><div class="fill" style="width:${(b[1]*100).toFixed(1)}%"></div></div></div>`).join('');
 B[0][2]='';document.querySelector('#bars .bar-top span:last-child').textContent=Math.floor(dayP*100)+'%';
 document.getElementById('month').textContent=d.toLocaleDateString([],{month:'long',year:'numeric'});
 const first=(mS.getDay()+6)%7,days=new Date(y,mo+1,0).getDate();
 let html='<tr>'+['M','T','W','T','F','S','S'].map(x=>`<th>${x}</th>`).join('')+'</tr><tr>';
 for(let i=0;i<first;i++)html+='<td class="o">.</td>';
 for(let n=1;n<=days;n++){const c=(first+n-1)%7;html+=`<td class="${n==d.getDate()?'t':''}"><span>${n}</span></td>`;if(c==6&&n<days)html+='</tr><tr>';}
 document.getElementById('cal').innerHTML=html+'</tr>';
 const doy=Math.floor((d-new Date(y,0,0))/864e5);
 document.getElementById('q').innerHTML='<b>“</b>'+Q[doy%Q.length]+'<b>”</b>';
}
render();setInterval(render,30000);
document.getElementById('time').title='Click to switch 12h / 24h';document.getElementById('time').style.cursor='pointer';
document.getElementById('time').addEventListener('click',()=>{H24=!H24;try{localStorage.setItem('sf_h24_habit',H24?'1':'0');}catch(e){}render();});
</script></body></html>
