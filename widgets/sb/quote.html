<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily note</title><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F7F3EE;--card:#FFFFFF;--ink:#3B2F26;--muted:#8A7A6C;--accent:#4A6B4F;--line:#E6DDD2}
@media (prefers-color-scheme: dark){:root{--bg:#25211E;--card:#2E2925;--ink:#F1E9DF;--muted:#B3A595;--accent:#8DB492;--line:#433B34}}
html,body{height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:100%;max-width:520px;min-height:172px;display:flex;flex-direction:column;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:22px 24px;text-align:center}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.serif{font-family:Georgia,"Times New Roman",serif}

.q{font-size:21px;line-height:1.4;margin:12px 0 0}
.mark{color:var(--accent);font-size:30px;line-height:0;vertical-align:-10px;margin-right:2px}
</style></head><body><div class="card">
<div class="label">✦ Thought for today</div>
<div class="q serif" id="q"></div>
</div><script>
const Q=["Small steps every day add up to big change.", "Write it down. Your mind is for ideas, not for holding them.", "Done is better than perfect.", "Focus on the next step, not the whole staircase.", "A clear page makes a clear mind.", "Start where you are. Use what you have.", "You don't need more time. You need fewer things.", "Rest is part of the work.", "One thing at a time. Then the next.", "Plans are guesses. Review them every week.", "Protect your mornings.", "Your future self will thank you for today's notes.", "Make it easy to start.", "Progress, not pressure.", "What gets reviewed gets done.", "Say no to most things so you can say yes to what matters.", "Capture first. Sort later.", "Slow is smooth. Smooth is fast.", "Small habits, big life.", "Choose the one task that makes everything else easier.", "Clear the inbox, clear the head.", "Ideas are cheap. Saved ideas are gold.", "Be kind to yourself on slow days.", "Finish what you start this week.", "The best system is the one you use.", "Less, but better.", "Take the first step now. Fix it later.", "Good days are built, not found.", "Your goals need a calendar, not a wish.", "Keep going. You're closer than you think.", "Today counts."];
const d=new Date();const n=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
document.getElementById('q').innerHTML='<span class="mark">“</span>'+Q[n%Q.length]+'<span class="mark">”</span>';
</script></body></html>
