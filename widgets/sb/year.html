<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year progress</title><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F7F3EE;--card:#FFFFFF;--ink:#3B2F26;--muted:#8A7A6C;--accent:#4A6B4F;--line:#E6DDD2}
@media (prefers-color-scheme: dark){:root{--bg:#25211E;--card:#2E2925;--ink:#F1E9DF;--muted:#B3A595;--accent:#8DB492;--line:#433B34}}
html,body{height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:100%;max-width:520px;min-height:172px;display:flex;flex-direction:column;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:22px 24px;text-align:center}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.serif{font-family:Georgia,"Times New Roman",serif}

.big{font-size:46px;line-height:1.1;margin:10px 0 10px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:99px;width:0}
.sub{font-size:15px;color:var(--muted);margin-top:10px}
</style></head><body><div class="card">
<div class="label" id="yl">Year progress</div>
<div class="big serif" id="pct">0%</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="sub" id="left"></div>
</div><script>
const d=new Date(),y=d.getFullYear(),s=new Date(y,0,1),e=new Date(y+1,0,1);
const p=(d-s)/(e-s),left=Math.ceil((e-d)/864e5);
document.getElementById('yl').textContent=y+' progress';
document.getElementById('pct').textContent=Math.floor(p*100)+'%';
document.getElementById('fill').style.width=(p*100).toFixed(1)+'%';
document.getElementById('left').textContent=left+' days left. Make them count.';
</script></body></html>
