<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clock</title><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F7F3EE;--card:#FFFFFF;--ink:#3B2F26;--muted:#8A7A6C;--accent:#4A6B4F;--line:#E6DDD2}
@media (prefers-color-scheme: dark){:root{--bg:#25211E;--card:#2E2925;--ink:#F1E9DF;--muted:#B3A595;--accent:#8DB492;--line:#433B34}}
html,body{height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:100%;max-width:520px;min-height:172px;display:flex;flex-direction:column;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:22px 24px;text-align:center}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.serif{font-family:Georgia,"Times New Roman",serif}

.time{font-size:46px;line-height:1.1;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.date{font-size:15px;color:var(--muted)}
</style></head><body><div class="card">
<div class="label" id="greet">Hello</div>
<div class="time serif" id="time">--:--</div>
<div class="date" id="date"></div>
</div><script>
function tick(){const d=new Date();const h=d.getHours();
document.getElementById('greet').textContent=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
document.getElementById('time').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
document.getElementById('date').textContent=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});}
tick();setInterval(tick,10000);
</script></body></html>
