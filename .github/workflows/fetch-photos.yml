name: Fetch photos
on:
  push:
    paths: ["photos/list.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          cd photos
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSL --retry 3 -o "$name.jpg" "$url" || echo "FAILED $name" >> log.txt
            echo "$name $(stat -c %s "$name.jpg")" >> log.txt
          done < list.txt
          cat log.txt
      - name: Commit
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git pull -q --rebase || true
          git add photos
          git commit -m "Self-hosted page photos" || echo "nothing new"
          git push
