<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;cursor:none}
body{display:flex;align-items:center;justify-content:center;background:#f6efe9}
img{max-width:100vw;max-height:100vh;display:block}
</style></head><body><img id="i"><script>
const p=new URLSearchParams(location.search);const s=p.get('img')||'';
if(/^[a-z0-9\-\/.]+\.jpg$/i.test(s)){document.getElementById('i').src=s;}
if(p.get('bg')&&/^[0-9a-f]{6}$/i.test(p.get('bg')))document.body.style.background='#'+p.get('bg');
</script></body></html>
